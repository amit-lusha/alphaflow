[project]
name = "alphaflow"
version = "0.1.0"
description = "AI-powered financial analysis agent using LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain",
    "langchain-google-genai",
    "langgraph",
    "pydantic",
    "python-dotenv",
    "langsmith",
    "yfinance",
    "langchain-chroma",
    "chromadb>=1.4.0",
    "beautifulsoup4>=4.14.3",
    "langchain-community>=0.4.1",
    "urllib3<2.0",
    "mcp>=1.25.0",
    "langchain-mcp-adapters>=0.2.1",
    "langgraph-checkpoint-sqlite>=3.0.1",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "aiosqlite>=0.21.0",
    "psycopg>=3.3.2",
    "langchain-postgres>=0.0.16",
    "langgraph-checkpoint-postgres>=3.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
