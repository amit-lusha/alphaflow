[project]
name = "alphaflow"
version = "0.1.0"
description = "AI-powered financial analysis agent using LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain",
    "langchain-google-genai",
    "langgraph",
    "pydantic",
    "python-dotenv",
    "langsmith",
    "yfinance",
    "langchain-chroma",
    "chromadb>=1.4.0",
    "beautifulsoup4>=4.14.3",
    "langchain-community>=0.4.1",
    "urllib3<2.0",
    "mcp>=1.25.0",
    "langchain-mcp-adapters>=0.2.1",
    "langgraph-checkpoint-sqlite>=3.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
